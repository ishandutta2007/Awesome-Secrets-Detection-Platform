<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="40%" stop-color="#0c1322" />
      <stop offset="80%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>

    <!-- Title Gradient with dynamic shift -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#00f2fe;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#38bdf8;#818cf8;#00f2fe" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Shield & Accent Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="radarSweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Laser Scanner Line Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0" />
      <stop offset="15%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#fb7185" stop-opacity="1" />
      <stop offset="85%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </linearGradient>

    <!-- Laser Aura Gradient -->
    <linearGradient id="laserAura" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" opacity="0.25" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes radarRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes laserScan {
        0%, 100% { transform: translateY(0px); opacity: 0.9; }
        50% { transform: translateY(112px); opacity: 0.9; }
      }
      @keyframes pulseHalo {
        0%, 100% { transform: scale(1); opacity: 0.35; }
        50% { transform: scale(1.18); opacity: 0.65; }
      }
      @keyframes livePulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.25; transform: scale(0.85); }
      }
      @keyframes floatTerminal {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      .radar-sweep {
        transform-origin: 145px 210px;
        animation: radarRotate 6s linear infinite;
      }
      .laser-scanner {
        animation: laserScan 3.5s ease-in-out infinite;
      }
      .halo-effect {
        transform-origin: 145px 210px;
        animation: pulseHalo 4s ease-in-out infinite;
      }
      .live-dot {
        transform-origin: 326px 55px;
        animation: livePulse 1.8s ease-in-out infinite;
      }
      .terminal-float {
        animation: floatTerminal 5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="18" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="18" fill="url(#grid)" />
  <rect x="1.5" y="1.5" width="1197" height="417" rx="16.5" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-opacity="0.85" />

  <!-- Corner Tech Accent Brackets -->
  <path d="M 12 36 L 12 12 L 36 12" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
  <path d="M 1188 36 L 1188 12 L 1164 12" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
  <path d="M 12 384 L 12 408 L 36 408" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
  <path d="M 1188 384 L 1188 408 L 1164 408" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />

  <!-- Ambient Light Orbs -->
  <circle cx="145" cy="210" r="130" fill="#0284c7" opacity="0.12" filter="url(#glow)">
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="950" cy="120" r="140" fill="#6366f1" opacity="0.09" filter="url(#glow)">
    <animate attributeName="opacity" values="0.06;0.14;0.06" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Ambient Starglow / Constellation nodes -->
  <circle cx="85" cy="65" r="2" fill="#38bdf8">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="265" cy="85" r="2.5" fill="#818cf8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="1120" cy="75" r="2" fill="#00f2fe">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="1145" cy="355" r="2.5" fill="#38bdf8">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="80" cy="365" r="2" fill="#818cf8">
    <animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.2s" repeatCount="indefinite" />
  </circle>

  <!-- ================= LEFT RADAR / SHIELD SECURITY HUB ================= -->
  <g id="security-hub">
    <!-- Pulsing outer halo -->
    <circle cx="145" cy="210" r="105" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-dasharray="5 7" opacity="0.4" class="halo-effect">
      <animate attributeName="r" values="95;110;95" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.25;0.5;0.25" dur="4s" repeatCount="indefinite" />
    </circle>

    <!-- Concentric radar rings -->
    <circle cx="145" cy="210" r="88" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="145" cy="210" r="68" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="145" cy="210" r="48" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="0.5" />

    <!-- Compass / Crosshair Marks -->
    <line x1="145" y1="98" x2="145" y2="108" stroke="#38bdf8" stroke-width="2" opacity="0.7" />
    <line x1="145" y1="312" x2="145" y2="322" stroke="#38bdf8" stroke-width="2" opacity="0.7" />
    <line x1="33" y1="210" x2="43" y2="210" stroke="#38bdf8" stroke-width="2" opacity="0.7" />
    <line x1="247" y1="210" x2="257" y2="210" stroke="#38bdf8" stroke-width="2" opacity="0.7" />

    <!-- Rotating Radar Scanner Beam -->
    <g class="radar-sweep">
      <path d="M 145 210 L 233 160 A 105 105 0 0 1 247 210 Z" fill="url(#radarSweepGrad)" opacity="0.6" />
      <line x1="145" y1="210" x2="250" y2="210" stroke="#00f2fe" stroke-width="1.8" filter="url(#softGlow)" />
      <circle cx="230" cy="180" r="3.5" fill="#f43f5e" opacity="0.85">
        <animate attributeName="opacity" values="0.1;1;0.1" dur="2s" repeatCount="indefinite" />
      </circle>
      <!-- SMIL fallback rotate animation -->
      <animateTransform attributeName="transform" type="rotate" from="0 145 210" to="360 145 210" dur="6s" repeatCount="indefinite" />
    </g>

    <!-- Shield Core -->
    <path d="M 145 142 L 195 166 C 195 218, 145 264, 145 264 C 145 264, 95 218, 95 166 Z" 
          fill="#0a1226" fill-opacity="0.8" stroke="url(#shieldGrad)" stroke-width="3" filter="url(#glow)" />

    <path d="M 145 152 L 185 171 C 185 212, 145 250, 145 250 C 145 250, 105 212, 105 171 Z" 
          fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4 3" />

    <!-- Padlock inside Shield -->
    <!-- Shackle -->
    <path d="M 135 197 L 135 186 C 135 180.5, 139.5 176, 145 176 C 150.5 176, 155 180.5, 155 186 L 155 197" 
          fill="none" stroke="#00f2fe" stroke-width="2.8" stroke-linecap="round" />
    <!-- Lock Body -->
    <rect x="127" y="197" width="36" height="28" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="2.2" />
    <!-- Keyhole & glowing core -->
    <circle cx="145" cy="208" r="3.5" fill="#00f2fe">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
    </circle>
    <path d="M 145 211 L 145 218" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" />

    <!-- Radar blip detected tags -->
    <circle cx="85" cy="180" r="3" fill="#38bdf8" opacity="0.6" />
    <circle cx="205" cy="245" r="2.5" fill="#10b981" opacity="0.7" />
  </g>

  <!-- ================= RIGHT CONTENT AREA ================= -->

  <!-- Top Badges / Status Pills -->
  <g transform="translate(310, 42)">
    <!-- Live Status Pill -->
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#091426" stroke="#1e3a5f" stroke-width="1.2" />
    <circle cx="16" cy="13" r="4.5" fill="#10b981" class="live-dot">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.8">SCANNER ONLINE</text>

    <!-- Prevention Badge -->
    <rect x="192" y="0" width="220" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="206" y="17" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.4">PUSH PROTECTION &amp; NHI GUARD</text>

    <!-- Scope Pill -->
    <rect x="424" y="0" width="140" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="436" y="17" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.4">GIT &amp; CI/CD AUDIT</text>
  </g>

  <!-- Main Platform Title -->
  <text x="310" y="112" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.6">Awesome Secrets Detection Platform</text>
  
  <!-- Subtitle -->
  <text x="310" y="142" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" letter-spacing="0.1">
    Ecosystem Guide to Secret Scanning, Pre-Commit Hooks, NHI Governance &amp; ASPM
  </text>

  <!-- ================= TERMINAL SCAN SIMULATOR ================= -->
  <g class="terminal-float" transform="translate(310, 164)">
    <!-- Terminal Background -->
    <rect x="0" y="0" width="850" height="170" rx="12" fill="#030712" stroke="#1e293b" stroke-width="1.4" />

    <!-- Terminal Titlebar -->
    <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 838 0 C 844.627 0 850 5.373 850 12 L 850 32 L 0 32 Z" fill="#090f1d" />
    <line x1="0" y1="32" x2="850" y2="32" stroke="#1e293b" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="18" cy="16" r="4.5" fill="#ef4444" opacity="0.85" />
    <circle cx="34" cy="16" r="4.5" fill="#f59e0b" opacity="0.85" />
    <circle cx="50" cy="16" r="4.5" fill="#10b981" opacity="0.85" />
    <text x="70" y="20" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500">push-protection-guard — git-hook-engine v3.4</text>

    <!-- Terminal Code Text -->
    <g transform="translate(20, 36)">
      <!-- Command line -->
      <text x="0" y="22" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">$ git push origin main --verify-secrets</text>
      
      <!-- Detection Alert -->
      <g transform="translate(0, 44)">
        <rect x="-4" y="-14" width="765" height="22" rx="4" fill="#881337" fill-opacity="0.35" stroke="#f43f5e" stroke-width="0.75" stroke-opacity="0.4" />
        <text x="4" y="2" fill="#f43f5e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">✖ [LEAK DETECTED]</text>
        <text x="146" y="2" fill="#fca5a5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">AWS_SECRET_KEY="AKIA************ / wJalrXUtnFEMI..."</text>
        <text x="640" y="2" fill="#fda4af" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">(Entropy: 4.82)</text>
      </g>

      <!-- Verification Status -->
      <g transform="translate(0, 72)">
        <rect x="-4" y="-14" width="765" height="22" rx="4" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.4" />
        <text x="4" y="2" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">✔ [ACTIVE VERIFIED]</text>
        <text x="156" y="2" fill="#a7f3d0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">Live STS Verification: ACTIVE CREDENTIAL (IAM: deployer-role)</text>
      </g>

      <!-- Remediation & Action -->
      <g transform="translate(0, 100)">
        <text x="4" y="2" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600">🛡️ [POLICY ENFORCED]</text>
        <text x="172" y="2" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">Push rejected • Secret auto-quarantined • Rotation workflow dispatched</text>
      </g>

      <!-- Dynamic Laser Scan Line and Aura in Terminal Box -->
      <g class="laser-scanner">
        <rect x="0" y="8" width="810" height="16" fill="url(#laserAura)" />
        <line x1="0" y1="24" x2="810" y2="24" stroke="url(#laserGrad)" stroke-width="2" filter="url(#softGlow)" />
        <!-- SMIL Fallback for SVG viewers lacking CSS keyframes support -->
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 88; 0 0" dur="3.5s" repeatCount="indefinite" />
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM TOOL ECOSYSTEM PILLS ================= -->
  <g transform="translate(310, 356)">
    <!-- Gitleaks -->
    <g transform="translate(0, 0)">
      <rect width="90" height="28" rx="7" fill="#0b1329" stroke="#1e3a5f" stroke-width="1.2" />
      <text x="45" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Gitleaks</text>
    </g>

    <!-- TruffleHog -->
    <g transform="translate(100, 0)">
      <rect width="105" height="28" rx="7" fill="#0b1329" stroke="#1e3a5f" stroke-width="1.2" />
      <text x="52.5" y="18" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">TruffleHog</text>
    </g>

    <!-- GitGuardian -->
    <g transform="translate(215, 0)">
      <rect width="112" height="28" rx="7" fill="#0b1329" stroke="#1e3a5f" stroke-width="1.2" />
      <text x="56" y="18" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">GitGuardian</text>
    </g>

    <!-- GitHub Push Protection -->
    <g transform="translate(337, 0)">
      <rect width="185" height="28" rx="7" fill="#0b1329" stroke="#1e3a5f" stroke-width="1.2" />
      <text x="92.5" y="18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">GitHub Push Protection</text>
    </g>

    <!-- Trivy -->
    <g transform="translate(532, 0)">
      <rect width="78" height="28" rx="7" fill="#0b1329" stroke="#1e3a5f" stroke-width="1.2" />
      <text x="39" y="18" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Trivy</text>
    </g>

    <!-- Semgrep -->
    <g transform="translate(620, 0)">
      <rect width="95" height="28" rx="7" fill="#0b1329" stroke="#1e3a5f" stroke-width="1.2" />
      <text x="47.5" y="18" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Semgrep</text>
    </g>

    <!-- Doppler / NHI -->
    <g transform="translate(725, 0)">
      <rect width="125" height="28" rx="7" fill="#0b1329" stroke="#1e3a5f" stroke-width="1.2" />
      <text x="62.5" y="18" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Doppler / NHI</text>
    </g>
  </g>
</svg>
